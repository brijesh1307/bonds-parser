# Install once per clone:  pre-commit install
# Run on everything:        pre-commit run --all-files
# ruff runs in its own pinned environment; mypy runs from the project virtualenv (activate .venv first)
# because it needs the project's installed packages.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: (\.(pdf|xlsx)$|^samples/)
      - id: trailing-whitespace
        exclude: (\.(pdf|xlsx|md)$|^samples/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9   # keep in step with ruff in requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (app)
        entry: mypy
        language: system
        types: [python]
        files: ^app/
        pass_filenames: false
      # Real deal slips must never reach git (docs/10_testing_strategy.md §12, risk R-13).
      - id: block-real-slips
        name: block real slips under samples/real/
        entry: "Real deal slips must not be committed: move the file out of samples/real/"
        language: fail
        files: ^samples/real/
        exclude: ^samples/real/README\.md$
      - id: block-env-file
        name: block .env
        entry: ".env holds local settings/secrets and must not be committed"
        language: fail
        files: (^|/)\.env$
